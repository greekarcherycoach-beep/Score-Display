name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: |
          SM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SM" ]; then yes | "$SM" --licenses > /dev/null || true; fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: |
          S=$(find . -name settings.gradle.kts | head -1)
          if [ -z "$S" ]; then echo "ERROR: settings.gradle.kts not found"; ls -la; exit 1; fi
          cd "$(dirname "$S")"
          gradle assembleDebug --no-daemon --stacktrace -PbuildNum=${{ github.run_number }}
          APK=$(find "$PWD" -name app-debug.apk | head -1)
          if [ -z "$APK" ]; then echo "ERROR: app-debug.apk not found"; find "$PWD" -name "*.apk"; exit 1; fi
          ls -la "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ArcheryLab-APK
          path: ${{ env.APK }}
          if-no-files-found: error
      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest "$APK" --title "Archery Lab APK - build ${{ github.run_number }}" --notes "Build ${{ github.run_number }}"
