M['QRPolynomial']=function(module){var QRMath = R('QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );

	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;

	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {

		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}

	}

	var rsBlock = QRRSBlock.getRsBlockTable(typeNumber, errorCorrectLevel);

		throw new Error("bad rs block @ typeNumber:" + typeNumber + "/errorCorrectLevel:" + errorCorrectLevel);

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );

	}

	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}

            var modIndex = x + modPoly.getLength() - ecdata[r].length;

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

function scanErr(e){const n=(e&&(e.name||e.message))||'';if(n=='insecure')return '⚠ Η κάμερα μπλοκάρεται σε αυτό τον τρόπο ανοίγματος. Ανοίξτε το αρχείο στο Chrome με διεύθυνση file:///storage/emulated/0/Download/… ή χρησιμοποιήστε τη χειροκίνητη σύνδεση.';if(n=='nobd')return '⚠ Αυτός ο browser δεν διαβάζει QR μέσα στη σελίδα (χρειάζεται Chrome σε Android). Χρησιμοποιήστε τη χειροκίνητη σύνδεση.';if(n=='NotAllowedError')return '⚠ Η κάμερα δεν επιτρέπεται. Στο Chrome πατήστε το εικονίδιο 🔒/ⓘ δίπλα στη διεύθυνση → Δικαιώματα → Κάμερα → Να επιτρέπεται. Αν δεν υπάρχει: Ρυθμίσεις Android → Εφαρμογές → Chrome → Δικαιώματα → Κάμερα → Να επιτρέπεται. Μετά πατήστε «Ξαναδοκιμή».';return '⚠ Η κάμερα δεν ξεκίνησε ('+n+'). Χρησιμοποιήστε τη χειροκίνητη σύνδεση.'}
function ask(msg){return new Promise(r=>{const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:999;background:#000b;display:grid;place-items:center;padding:20px';const b=document.createElement('div');b.style.cssText='background:#151a21;border:1px solid #ffffff22;border-radius:18px;padding:22px;max-width:420px;width:100%;text-align:center;font-size:19px;font-weight:700;color:#fff';b.textContent=msg;const row=document.createElement('div');row.style.cssText='display:flex;gap:10px;margin-top:18px';[['Ναι','#dc2626',true],['Όχι','#334155',false]].forEach(a=>{const x=document.createElement('button');x.textContent=a[0];x.style.cssText='flex:1;padding:14px;border:0;border-radius:12px;color:#fff;font-size:18px;font-weight:800;min-height:50px;background:'+a[1];x.onclick=()=>{d.remove();r(a[2])};row.appendChild(x)});b.appendChild(row);d.appendChild(b);document.body.appendChild(d)})}
function nscan(cb){const e=document.getElementById('ce');if(e)e.textContent='';window.onNativeScan=t=>{if(t)cb(t)};window.onNativeScanError=m=>{const x=document.getElementById('ce');if(x)x.textContent='⚠ '+m};Native.scan()}
function stopScan(){if(SC){SC.on=false;SC.st.getTracks().forEach(t=>t.stop());SC=null}}
const copy=id=>{const e=document.getElementById(id);e.select();try{navigator.clipboard.writeText(e.value)}catch(x){document.execCommand('copy')}};

const $=i=>document.getElementById(i);const keep=[];let pend=null,peers=new Set(),R=[],cur=null,seen=new Map(),sm=0,first=true,ed=false,lastT='',face='user';
try{R=JSON.parse(localStorage.getItem('arch_R')||'[]')}catch(e){}
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3000)};
function ui(){$('pc').textContent='📱 '+peers.size+' συνδεδεμένα κινητά';$('pc').className='pill'+(peers.size?'':' z')}
async function newOffer(){if(pend&&pend.dc.readyState!='open'){try{pend.pc.close()}catch(e){}}lastT='';const pc=new RTCPeerConnection({iceServers:[]}),dc=pc.createDataChannel('s'),me={pc,dc};pend=me;keep.push(me);$('qs').textContent='⏳ Δημιουργία QR…';
 dc.onopen=()=>{peers.add(dc);ui()};dc.onclose=()=>{peers.delete(dc);ui()};
 dc.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type=='result'){R=R.filter(x=>x.id!=d.data.id).concat(d.data);localStorage.setItem('arch_R',JSON.stringify(R));dc.send(JSON.stringify({type:'ack',id:d.data.id}));toast('✅ Νέο σκορ: '+d.data.name+' — '+d.data.total);render()}}catch(x){}};
 await pc.setLocalDescription(await pc.createOffer());await gather(pc);const code=await pack(pc.localDescription.sdp);if(pend!==me)return;drawQR($('qr'),code);$('code').value=code;$('qs').textContent='Έτοιμο για νέο κινητό'}
async function gotAnswer(t){t=(t||'').trim();if(!pend||!t||t===lastT)return;lastT=t;const me=pend;try{const sdp=await unpack(t);await me.pc.setRemoteDescription({type:'answer',sdp});toast('📲 Σύνδεση κινητού…');
 me.dc.addEventListener('open',()=>{toast('✅ Το κινητό συνδέθηκε');if(pend===me)newOffer()},{once:true});setTimeout(()=>{if(pend===me&&me.dc.readyState!='open')newOffer()},12000)}catch(e){lastT='';toast('⚠ Μη έγκυρος κωδικός')}}
async function startCam(){$('rt').style.display='none';$('ce').textContent='';$('cam').style.display='block';if(window.Native){$('cam').style.display='none';document.querySelector('[onclick="flip()"]').style.display='none';$('nb').style.display='block';$('qs').textContent='Έτοιμο για νέο κινητό';return}try{await scan($('cam'),gotAnswer,face)}catch(e){$('rt').style.display='inline-block';$('ce').textContent=scanErr(e);if(!SC)$('cam').style.display='none'}}
async function flip(){face=face=='user'?'environment':'user';$('cam').style.display='block';await startCam()}
const grad=[['#f59e0b','#b45309'],['#94a3b8','#475569'],['#d97706','#7c2d12']],med=['🥇','🥈','🥉'],hue=i=>{const h=[200,150,270,330,20,170,230,100][i%8];return[`hsl(${h} 70% 45%)`,`hsl(${h} 70% 28%)`]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fit(){const w=$('gw');if(!w)return;const h=Math.floor((w.clientHeight-3*14)/4);$('g').style.gridAutoRows=Math.max(84,h)+'px'}
function render(){const f=[...new Set(R.map(d=>d.fmt))];if(!f.includes(cur))cur=f.sort((a,b)=>R.filter(d=>d.fmt==b).length-R.filter(d=>d.fmt==a).length)[0]||null;
 $('tabs').innerHTML=f.map(x=>`<button class="${x==cur?'on':''}" onclick="cur='${x}';render()">🎯 ${x} (${R.filter(d=>d.fmt==x).length})</button>`).join('');$('em').style.display=R.length?'none':'block';document.body.classList.toggle('one',f.length<=1);
 const L=R.filter(d=>d.fmt==cur).sort((a,b)=>b.total-a.total||a.time-b.time);
 $('g').innerHTML=L.map((d,i)=>{const tt=d.ends*d.arrows,mx=tt*10,c=i<3?grad[i]:hue(i),n=!first&&!seen.has(d.id),u=!n&&!first&&seen.get(d.id)!==d.time,live=d.final===false,sh=d.shot||tt,cb=Math.min(d.ends,Math.max(1,Math.ceil(sh/d.arrows)));
 return`<div class="tile${n?' new':''}${u?' upd':''}${live?' live':''}" style="background:linear-gradient(135deg,${c[0]},${c[1]})"><div class="rk"><b>#${i+1}</b><span>${med[i]||''}</span></div><div class="mid"><div class="nm${d.name.length>13?' l':''}">${esc(d.name)}</div><div class="pr">Βολή ${cb} από ${d.ends}</div><div class="bar"><i style="width:${Math.min(100,sh/tt*100)}%"></i></div></div><div class="pt">${d.total}<small>/${mx}</small></div><button class="x" onclick="del('${d.id}')">🗑</button></div>`}).join('');
 R.forEach(d=>seen.set(d.id,d.time));first=false;fit()}
addEventListener('resize',fit);
function sv(){localStorage.setItem('arch_R',JSON.stringify(R));render()}
async function del(id){if(await ask('Διαγραφή αποτελέσματος;')){R=R.filter(x=>x.id!=id);sv()}}
async function clr(){if(await ask('Διαγραφή ΟΛΩΝ των αποτελεσμάτων;')){R=[];sv()}}
let WL=null;async function wake(){try{if('wakeLock' in navigator&&!WL){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>WL=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible')wake()});addEventListener('pointerdown',wake);wake();
let FS=false;
function setPres(on){FS=on;document.body.classList.toggle('pres',on);
 if(window.Native&&Native.fullscreen)Native.fullscreen(on);
 else if(on){try{document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}else if(document.fullscreenElement)document.exitFullscreen();
 if(on)toast('Για έξοδο πατήστε την επικεφαλίδα (πάνω αριστερά)');[100,500,1200].forEach(ms=>setTimeout(fit,ms))}
function fs(){setPres(!FS)}
window.exitPres=()=>{if(FS)setPres(false)};
window.onFsState=v=>{if(v)toast('⚠ Το σύστημα κρατά ορατά τα κουμπιά πλοήγησης')};
addEventListener('beforeunload',e=>{e.preventDefault();e.returnValue=''});
render();ui();(async()=>{await startCam();newOffer()})();
</script></body></html>
